name: Build Real Android APK Engine

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Real 15MB Android APK
        run: |
          git clone --depth 1 https://github.com/xchacha20-poly1305/webview-apk-template.git android-shell
          cd android-shell
          echo "app.url=https://jyfohdlkxxwpsdc4tiuy.streamlit.app/" > app.properties
          echo "app.package=com.supremeagent.app" >> app.properties
          echo "app.name=Supreme Agent" >> app.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/SupremeAgent_Real_v1.0.apk
          ls -lh ../dist/SupremeAgent_Real_v1.0.apk

      - name: Publish Real APK to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.0
          name: "Supreme Agent Real Android APK v2.0.0"
          draft: false
          prerelease: false
          files: dist/SupremeAgent_Real_v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
