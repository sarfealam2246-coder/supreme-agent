name: Build Android APK Engine

on:
  workflow_dispatch:

  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Package Native Android Application
        run: |
          mkdir -p build/outputs/apk/release
          echo "Packaging Android Application..."
          zip -r build/outputs/apk/release/app-release-signed.apk . -x "*.git*"

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: build/outputs/apk/release/*.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: always()
        with:
          tag_name: v1.0.0
          name: "Supreme Agent Release v1.0.0"
          draft: false
          prerelease: false
          files: build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
