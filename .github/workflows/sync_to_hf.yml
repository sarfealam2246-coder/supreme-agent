name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4

      - name: Push Studio Files to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          pip install -q huggingface_hub
          python3 -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'].strip())
          repo = os.environ['HF_SPACE_REPO'].strip()
          for f in ['README.md', 'requirements.txt', 'app.py']:
              if os.path.exists(f):
                  api.upload_file(path_or_fileobj=f, path_in_repo=f, repo_id=repo, repo_type='space')
          print('SYNCED_OK:', repo)
          "
